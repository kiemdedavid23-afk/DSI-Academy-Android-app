name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Récupérer les assets (polices et images)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download assets-v1 --repo "$GITHUB_REPOSITORY" --pattern assets.zip --dir "$RUNNER_TEMP"
          unzip -q -o "$RUNNER_TEMP/assets.zip" -d .
          for f in src/assets/fonts/Manrope-Regular.ttf src/assets/images/app-icon.webp; do
            [ -f "$f" ] || { echo "::error::Asset manquant après extraction : $f"; exit 1; }
          done

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json absent. Lance d'abord le workflow Lockfile."
            exit 1
          fi
          npm ci --no-audit --no-fund --prefer-offline

      - name: Generate build config (secret or fixture)
        if: ${{ !cancelled() }}
        env:
          DSI_REGISTRY_JSON: ${{ secrets.DSI_REGISTRY_JSON }}
        run: |
          if [ -n "$DSI_REGISTRY_JSON" ]; then
            node scripts/generate-build-config.js
          else
            node scripts/generate-build-config.js --fixture
          fi

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test -- --ci --coverage=false --maxWorkers=2
