name: Créer l’architecture DSI Academy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche cible"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  scaffold:
    name: Générer l’arborescence de l’application
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Créer les dossiers et fichiers de base
        shell: bash
        run: |
          set -euo pipefail

          # Dossiers de l’application — aucun changement à .github/workflows/
          mkdir -p \
            android \
            assets/fonts \
            docs/contrats \
            docs/fiches \
            contracts \
            src/app/providers \
            src/app/navigation/HouseStacks \
            src/core/config \
            src/core/network \
            src/core/session \
            src/core/storage \
            src/core/i18n \
            src/core/platform \
            src/core/designsystem/theme \
            src/core/designsystem/components \
            src/core/designsystem/icons \
            src/core/utils \
            src/services/payment \
            src/services/content \
            src/services/shop \
            src/services/marketplace \
            src/services/community \
            src/features/auth/registration-browser \
            src/features/member-space \
            src/features/academy \
            src/features/content \
            src/features/shop \
            src/features/marketplace \
            src/features/community \
            src/shared

          # Conserver les dossiers encore vides dans Git
          find android assets docs contracts src \
            -type d -empty \
            -exec touch '{}/.gitkeep' \;

          # Configuration minimale du projet
          cat > package.json <<'EOF'
          {
            "name": "dsi-academy-app",
            "version": "0.1.0",
            "private": true,
            "scripts": {
              "typecheck": "tsc --noEmit",
              "lint": "eslint .",
              "test": "jest"
            }
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "jsx": "react-native",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true
            },
            "include": ["src/**/*.ts", "src/**/*.tsx"]
          }
          EOF

          cat > jest.config.js <<'EOF'
          module.exports = {
            preset: 'react-native',
            testPathIgnorePatterns: ['/node_modules/', '/android/']
          };
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          android/.gradle/
          android/app/build/
          .env
          .env.*
          !.env.example
          EOF

          cat > README.md <<'EOF'
          # DSI Academy App

          Application mobile Android React Native.

          ## Structure

          - `src/app` : application, providers et navigation.
          - `src/core` : configuration, réseau, session et design system.
          - `src/services` : clients et types des services API.
          - `src/features` : fonctionnalités organisées par domaine.
          - `src/shared` : éléments transversaux.
          - `docs` : architecture, plan, contrats et fiches de livraison.
          - `contracts` : fixtures JSON des réponses API.

          ## État initial

          Cette première génération crée l’arborescence et les fichiers de configuration.
          Le projet Android natif et ses dépendances React Native restent à initialiser.
          EOF

          cat > docs/PLAN.md <<'EOF'
          # Plan de réalisation

          1. Initialiser React Native pour Android et valider un build local.
          2. Mettre en place thèmes, design system et internationalisation.
          3. Ajouter configuration réseau et registre central des services.
          4. Implémenter session, authentification et navigation.
          5. Développer les services et fonctionnalités par domaine.
          6. Ajouter tests et fixtures de contrats API.
          7. Configurer les workflows CI et build Android séparément.
          EOF

          cat > docs/ARCHITECTURE.md <<'EOF'
          # Architecture

          - `src/core` contient les fondations indépendantes des fonctionnalités.
          - `src/services` contient les clients API, types et mappers.
          - `src/features` contient les fonctionnalités de l’application.
          - `src/shared` contient les éléments transversaux.
          - Les URL de services doivent être centralisées dans
            `src/core/config/serviceRegistry.ts`.
          - Aucun composant de fonctionnalité ne doit contenir de littéral visuel
            lorsqu’un composant du design system est disponible.
          EOF

          cat > docs/DESIGN-TOKENS.md <<'EOF'
          # Design tokens — v1.1 React Native

          À compléter avec les valeurs validées du produit :
          couleurs clair/sombre, typographies, rayons, ombres, espacements,
          transparence et animations.
          EOF

          cat > src/app/App.tsx <<'EOF'
          import React from 'react';
          import { SafeAreaView, Text } from 'react-native';

          export default function App() {
            return (
              <SafeAreaView>
                <Text>DSI Academy</Text>
              </SafeAreaView>
            );
          }
          EOF

          cat > src/core/config/buildConfig.ts <<'EOF'
          /**
           * Configuration injectée au build.
           * Ne pas placer de secrets dans l'application mobile.
           */
          export const buildConfig = {
            appName: 'DSI Academy',
            environment: 'development',
          } as const;
          EOF

          cat > src/core/config/serviceRegistry.ts <<'EOF'
          /**
           * Registre central des adresses de services.
           * Remplacer les valeurs d'exemple par la configuration d'environnement.
           */
          export const serviceRegistry = {
            mode: 'perService' as 'perService' | 'gateway',
           } as const;
          EOF

          cat > src/core/config/featureFlags.ts <<'EOF'
          export const featureFlags = {
            marketplace: false,
            communityCalls: false,
          } as const;
          EOF

          cat > src/core/i18n/fr.json <<'EOF'
          {
            "app.name": "DSI Academy",
            "common.loading": "Chargement…",
            "common.error": "Une erreur est survenue"
          }
          EOF

          cat > src/core/i18n/en.json <<'EOF'
          {
            "app.name": "DSI Academy",
            "common.loading": "Loading…",
            "common.error": "Something went wrong"
          }
          EOF

      - name: Commit et pousser les changements
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi

          git commit -m "chore: create DSI Academy app scaffold"
          git push origin "HEAD:${TARGET_BRANCH}"
