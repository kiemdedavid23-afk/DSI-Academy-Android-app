name: Créer l’architecture de départ

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche où créer l’architecture"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Créer l’arborescence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            android \
            assets/fonts \
            docs/contrats \
            docs/fiches \
            contracts \
            .github/workflows \
            src/app/providers \
            src/app/navigation/HouseStacks \
            src/core/config \
            src/core/network \
            src/core/session \
            src/core/storage \
            src/core/i18n \
            src/core/platform \
            src/core/designsystem/theme \
            src/core/designsystem/components \
            src/core/designsystem/icons \
            src/core/utils \
            src/services/payment \
            src/services/content \
            src/services/shop \
            src/services/marketplace \
            src/services/community \
            src/features/auth/registration-browser \
            src/features/member-space \
            src/features/academy \
            src/features/content \
            src/features/shop \
            src/features/marketplace \
            src/features/community \
            src/shared

          # Ajouter des fichiers .gitkeep pour que Git conserve les dossiers vides.
          find android assets docs contracts src -type d -empty -exec touch '{}/.gitkeep' \;

          # Fichiers de départ minimaux.
          cat > package.json <<'EOF'
          {
            "name": "dsi-academy-app",
            "version": "0.1.0",
            "private": true,
            "scripts": {
              "typecheck": "tsc --noEmit",
              "lint": "eslint .",
              "test": "jest"
            }
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "jsx": "react-native",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true
            },
            "include": ["src/**/*.ts", "src/**/*.tsx"]
          }
          EOF

          cat > jest.config.js <<'EOF'
          module.exports = {
            preset: 'react-native',
            testPathIgnorePatterns: ['/node_modules/', '/android/']
          };
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          android/.gradle/
          android/app/build/
          .env
          .env.*
          !.env.example
          EOF

          cat > src/app/App.tsx <<'EOF'
          import React from 'react';
          import { SafeAreaView, Text } from 'react-native';

          export default function App() {
            return (
              <SafeAreaView>
                <Text>DSI Academy</Text>
              </SafeAreaView>
            );
          }
          EOF

          cat > README.md <<'EOF'
          # DSI Academy App

          Application mobile Android React Native.

          ## État

          Cette livraison crée l’arborescence initiale et les fichiers de configuration minimaux.
          Elle ne génère pas encore le projet natif Android, les écrans métier, ni les services API.

          ## Prochaine étape

          Initialiser React Native et Gradle, installer les dépendances, puis implémenter
          l’application par lots à partir de `docs/PLAN.md`.
          EOF

          cat > docs/PLAN.md <<'EOF'
          # Plan de réalisation

          1. Initialiser le projet React Native Android et valider le build local.
          2. Mettre en place le design system, les thèmes et l’internationalisation.
          3. Implémenter la configuration réseau et le registre des services.
          4. Ajouter l’authentification, la session et la navigation.
          5. Développer les services et fonctionnalités par domaine.
          6. Ajouter les tests, les fixtures de contrats et les workflows CI/build.
          EOF

          cat > docs/ARCHITECTURE.md <<'EOF'
          # Architecture

          - `src/core` contient les fondations sans dépendance aux fonctionnalités.
          - `src/services` contient les clients et types des API, sans URL en dur.
          - `src/features` contient les fonctionnalités de l’application.
          - `src/shared` contient les états et composants transverses.
          - Les adresses de services doivent être centralisées dans
            `src/core/config/serviceRegistry.ts`.
          EOF

          cat > docs/DESIGN-TOKENS.md <<'EOF'
          # Design tokens — v1.1 React Native

          À compléter avec les tokens validés du produit : couleurs, typographie,
          espacements, rayons, ombres, thèmes clair/sombre et animations.
          EOF

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            checks:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                - run: npm ci
                - run: npm run typecheck --if-present
                - run: npm run lint --if-present
                - run: npm test -- --runInBand
          EOF

          cat > .github/workflows/build-apk.yml <<'EOF'
          name: Build APK
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: "17"
                - run: npm ci
                - name: Build debug APK
                  working-directory: android
                  run: |
                    chmod +x gradlew
                    ./gradlew assembleDebug
                - uses: actions/upload-artifact@v4
                  with:
                    name: dsi-academy-debug-apk
                    path: android/app/build/outputs/apk/debug/*.apk
                    if-no-files-found: error
          EOF

          # Prépare le fichier de sync sans pousser un dépôt à la configuration inconnue.
          cat > .github/workflows/sync-to-private.yml <<'EOF'
          name: Sync to private repository
          on:
            workflow_dispatch:
              inputs:
                confirm_sync:
                  description: "Saisir SYNC pour confirmer"
                  required: true
                  type: string
          permissions:
            contents: read
          jobs:
            sync:
              if: ${{ inputs.confirm_sync == 'SYNC' }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Configure private remote
                  run: |
                    echo "Configurez l'URL du dépôt privé avant d'activer le push."
                    echo "Ne pas lancer ce workflow avant configuration."
          EOF

      - name: Commit et pousser
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git commit -m "chore: scaffold DSI Academy app architecture"
          git push origin "HEAD:${BRANCH}"
