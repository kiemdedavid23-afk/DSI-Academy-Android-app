name: Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Générer package-lock.json depuis le registre officiel
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel http

      - name: Vérifier que tous les paquets viennent du registre officiel
        run: |
          if grep '"resolved"' package-lock.json | grep -v 'https://registry.npmjs.org/'; then
            echo "Hôte inattendu dans le lockfile"
            exit 1
          fi

      - name: Pousser sur la branche chore/lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/lockfile
          git add package-lock.json
          git commit -m "chore: générer package-lock.json" || echo "Aucun changement"
          git push --force origin chore/lockfile