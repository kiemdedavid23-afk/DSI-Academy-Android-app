name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json absent. Lance d'abord le workflow Lockfile."
            exit 1
          fi
          npm ci --no-audit --no-fund

      - name: Generate build config (secret or fixture)
        env:
          DSI_REGISTRY_JSON: ${{ secrets.DSI_REGISTRY_JSON }}
        run: |
          if [ -n "$DSI_REGISTRY_JSON" ]; then
            node scripts/generate-build-config.js
          else
            echo "::warning::Secret DSI_REGISTRY_JSON absent : APK en mode fixture, aucun Worker joignable."
            node scripts/generate-build-config.js --fixture
          fi

      - name: Copy fonts
        run: node scripts/copy-fonts.js

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsi-academy-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error