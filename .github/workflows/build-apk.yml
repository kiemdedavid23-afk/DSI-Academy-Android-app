name: Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les assets (polices et images)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download assets-v1 --repo "$GITHUB_REPOSITORY" --pattern assets.zip --dir "$RUNNER_TEMP"
          unzip -q -o "$RUNNER_TEMP/assets.zip" -d .
          for f in src/assets/fonts/Manrope-Regular.ttf src/assets/images/app-icon.webp; do
            [ -f "$f" ] || { echo "::error::Asset manquant après extraction : $f"; exit 1; }
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install JS dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json absent. Lance d'abord le workflow Lockfile."
            exit 1
          fi
          npm ci --no-audit --no-fund

      - name: Check DSI_REGISTRY_JSON secret
        env:
          DSI_REGISTRY_JSON: ${{ secrets.DSI_REGISTRY_JSON }}
        run: |
          if [ -z "$DSI_REGISTRY_JSON" ]; then
            echo "::error::Le secret DSI_REGISTRY_JSON est absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Generate build config from secret
        env:
          DSI_REGISTRY_JSON: ${{ secrets.DSI_REGISTRY_JSON }}
        run: node scripts/generate-build-config.js

      - name: Copy fonts
        run: node scripts/copy-fonts.js

      - name: Tune Gradle
        run: |
          if ! grep -q "org.gradle.caching" android/gradle.properties; then
            sed -i 's/-Xmx2048m/-Xmx4g/' android/gradle.properties
            # Le fichier peut ne pas finir par un retour à la ligne : on en force un
            [ -n "$(tail -c1 android/gradle.properties)" ] && echo "" >> android/gradle.properties
            {
              echo "org.gradle.parallel=true"
              echo "org.gradle.caching=true"
            } >> android/gradle.properties
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (signed with the debug key, for testing only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsi-academy-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error
